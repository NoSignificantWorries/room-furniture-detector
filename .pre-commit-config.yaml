repos:
    # ---- Базовые проверки файлов ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-yaml
        - id: check-toml
        - id: check-merge-conflict

  # ---- Ruff: линт + формат ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

#   - repo: https://github.com/psf/black
#     rev: 24.4.2
#     hooks:
#           - id: black
#
#   - repo: https://github.com/PyCQA/isort
#     rev: 5.13.2
#     hooks:
#         - id: isort
#           args: ["--profile", "black"]
#
#   - repo: https://github.com/PyCQA/flake8
#     rev: 7.0.0
#     hooks:
#         - id: flake8

    # ---- Prettier: web/ (HTML, CSS, JS, JSON, Markdown) ----
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [json, yaml, markdown, html, css, javascript]
        files: ^web/
        exclude: ^web/(node_modules|dist)/
