[project]
name = "room-furniture-detector"
version = "0.1.0"
description = "Automatic furniture detector that extracts bounding boxes with class labels from room photos and outputs them as JSON. Built for real-estate systems to automate furniture description."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "dvc>=3.67.1",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.143.0",
    "onnxruntime>=1.31.0",
    "tensorrt-lean>=11.4.0.106",
    "uvicorn[standard]>=0.54.0",
    "tritonclient[http]>=2.40.0",
    "python-multipart>=0.0.32",
    "pillow>=13.0.0",
]
train = [
    "fire>=0.7.1",
    "hydra-core>=1.3.7",
    "mlflow>=3.17.1",
    "pillow>=13.0.0",
    "torch>=2.14.1",
]
web = [
    "fastapi>=0.143.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]
export = [
    "fire>=0.7.1",
    "onnx>=1.23.2",
    "tensorrt>=11.4.0.106",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
export-onnx = "furniture_detector.export.to_onnx:main"
export-tensorrt = "furniture_detector.export.to_tensorrt:main"

[tool.uv]
extra-index-url = ["https://pypi.nvidia.com/"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["furniture_detector"]

[tool.ruff.format]
quote-style = "double"

